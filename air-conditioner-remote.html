<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空调遥控器 · AC Remote</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --accent:#38bdf8;
    --ink:#1e2733;
  }
  html,body{min-height:100%}
  body{
    background:#eaeef4;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:34px 16px;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }

  /* 环境光：随模式变色 */
  .ambient{
    position:fixed;top:48%;left:50%;
    width:min(1000px,125vw);height:min(820px,92vh);
    transform:translate(-50%,-50%);
    background:var(--accent);
    filter:blur(150px);
    opacity:.16;
    transition:background 1s ease,opacity .8s ease;
    pointer-events:none;z-index:0;
  }
  body.power-off .ambient{opacity:.045;background:#94a3b8}

  .stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px}

  /* ============ 遥控器机身 ============ */
  .remote{
    width:336px;
    padding:20px 18px 24px;
    border-radius:44px;
    background:linear-gradient(175deg,#ffffff 0%,#f7f9fc 42%,#e9edf4 100%);
    box-shadow:
      0 0 0 1px rgba(178,188,205,.55),
      0 1px 0 rgba(255,255,255,.95) inset,
      0 -1px 0 rgba(158,170,188,.22) inset,
      0 44px 70px -32px rgba(20,32,52,.48),
      0 12px 26px -14px rgba(20,32,52,.3);
    position:relative;
  }

  .ir{
    width:52px;height:10px;border-radius:6px;
    margin:0 auto 15px;
    background:linear-gradient(180deg,#4a5260,#232a34);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.32),0 1px 0 rgba(255,255,255,.85);
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 8px;margin-bottom:15px;
    font-size:11px;letter-spacing:.06em;
  }
  .brand{display:flex;align-items:center;gap:7px;font-weight:700;color:#3c4756;letter-spacing:.16em}
  .led{
    width:6px;height:6px;border-radius:50%;background:#c9d2df;
    transition:background .4s ease,box-shadow .4s ease;
  }
  .led.on{background:#34d399;box-shadow:0 0 9px #34d399}
  .model{color:#98a3b3;font-family:ui-monospace,Consolas,monospace;letter-spacing:0}

  /* ============ 液晶屏 ============ */
  .screen{
    padding:4px;border-radius:20px;
    background:linear-gradient(180deg,#dde2eb,#f4f6fa);
    box-shadow:inset 0 2px 5px rgba(20,32,52,.18),0 1px 0 #fff;
    margin-bottom:18px;
  }
  .lcd{
    height:172px;border-radius:16px;padding:14px 16px;
    background:radial-gradient(125% 105% at 50% -12%,#1d2d3f 0%,#0c131c 66%,#080d13 100%);
    box-shadow:inset 0 4px 15px rgba(0,0,0,.82);
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
    font-family:ui-monospace,"SF Mono",Consolas,"Courier New",monospace;
    color:var(--accent);
  }
  .lcd::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(168deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 44%);
  }
  .lcd-body{
    display:flex;flex-direction:column;justify-content:space-between;
    height:100%;position:relative;z-index:1;
    transition:opacity .45s ease,filter .45s ease;
  }
  .remote.off .lcd-body{opacity:0;filter:blur(4px)}
  .remote.off .lcd::after{opacity:.4}

  .lcd-row{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11px;letter-spacing:.09em;opacity:.88;gap:8px;
  }
  .lcd-row .chip{white-space:nowrap;display:inline-flex;align-items:center}

  .fanbars{display:inline-flex;align-items:flex-end;gap:2px;height:11px;margin-left:5px}
  .fanbars i{width:3px;background:currentColor;border-radius:1px;opacity:.22;transition:opacity .25s ease}
  .fanbars i:nth-child(1){height:5px}
  .fanbars i:nth-child(2){height:8px}
  .fanbars i:nth-child(3){height:11px}
  .fanbars i.on{opacity:1;box-shadow:0 0 6px currentColor}
  .fanbars.auto i{animation:fanPulse 2.2s ease-in-out infinite}
  .fanbars.auto i:nth-child(2){animation-delay:.25s}
  .fanbars.auto i:nth-child(3){animation-delay:.5s}
  @keyframes fanPulse{0%,100%{opacity:.35}50%{opacity:1}}

  .temp-row{display:flex;align-items:baseline;justify-content:center;gap:5px;line-height:1}
  .temp-val{
    display:inline-block;
    font-size:70px;font-weight:600;letter-spacing:-3px;
    font-variant-numeric:tabular-nums;
    filter:drop-shadow(0 0 13px var(--accent));
    transition:color .5s ease;
    transform-origin:center bottom;
  }
  .temp-val.pop{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(1)}38%{transform:scale(1.09)}100%{transform:scale(1)}}
  .unit{font-size:20px;opacity:.68}

  .flags{display:flex;gap:5px;align-items:center}
  .flags i{
    font-style:normal;font-size:10px;line-height:1.55;
    padding:0 5px;border-radius:5px;
    border:1px solid currentColor;opacity:.2;
    transition:opacity .3s ease,box-shadow .3s ease;
  }
  .flags i.on{opacity:1;box-shadow:0 0 9px -2px currentColor}

  /* ============ 按键 ============ */
  .keys{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px 12px;
    justify-items:center;
    padding-top:4px;
  }
  .key{
    width:70px;height:70px;border-radius:50%;
    border:1px solid #e0e5ee;
    background:linear-gradient(180deg,#ffffff,#eef1f6);
    color:#4a5566;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;
    box-shadow:
      0 2px 0 #d9dfe9,
      0 5px 12px -4px rgba(20,32,52,.22),
      inset 0 1px 0 #fff;
    transition:transform .09s ease,box-shadow .09s ease,color .3s ease,background .3s ease,border-color .3s ease;
    position:relative;
    user-select:none;
    font-family:inherit;
  }
  .key:hover{background:linear-gradient(180deg,#ffffff,#f5f7fb)}
  .key:active,.key.pressed{
    transform:translateY(2px);
    box-shadow:
      0 0 0 #d9dfe9,
      0 1px 3px -1px rgba(20,32,52,.2),
      inset 0 2px 7px rgba(20,32,52,.15);
  }
  .key svg{width:22px;height:22px;stroke-width:1.8;display:block}
  .key .lbl{font-size:10px;letter-spacing:.03em;opacity:.72}

  .key.active{
    color:var(--accent);
    border-color:var(--accent);
    background:linear-gradient(180deg,#ffffff,#f4f9ff);
    box-shadow:
      0 2px 0 #d9dfe9,
      0 5px 12px -4px rgba(20,32,52,.2),
      inset 0 0 14px -7px var(--accent);
  }
  .key.active svg{filter:drop-shadow(0 0 6px currentColor)}

  .key.power{color:#e2565c}
  .key.power:hover{background:linear-gradient(180deg,#fff,#fff5f5)}
  .key.power.on{color:#fff;border-color:transparent;background:linear-gradient(180deg,#ef6a70,#d9434a);box-shadow:0 2px 0 #c03a41,0 6px 14px -5px rgba(217,67,74,.6),inset 0 1px 0 rgba(255,255,255,.35)}
  .key.power.on .lbl{opacity:.9}
  .key.power.on svg{filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}

  /* ============ 底部提示 ============ */
  .hint{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center;
    font-size:12px;color:#7b8798;max-width:340px;
  }
  kbd{
    font-family:inherit;font-size:11px;padding:2px 6px;border-radius:5px;
    background:#fff;border:1px solid #dde3ec;box-shadow:0 1px 0 #dde3ec;color:#5b6676;
  }
  .sound-btn{
    border:1px solid #dde3ec;background:#fff;border-radius:999px;
    padding:5px 12px;font-size:12px;color:#5b6676;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;font-family:inherit;
    transition:border-color .2s,color .2s;
  }
  .sound-btn:hover{border-color:#c3cddd;color:#3d4757}

  @media (max-width:400px){
    body{padding:22px 12px}
    .remote{width:min(336px,94vw);padding:18px 14px 20px;border-radius:38px}
    .key{width:63px;height:63px}
    .key svg{width:20px;height:20px}
    .temp-val{font-size:62px}
    .lcd{height:158px}
  }
</style>
</head>
<body>
<div class="ambient" id="ambient"></div>

<main class="stage">
  <div class="remote" id="remote">
    <div class="ir"></div>

    <div class="topbar">
      <div class="brand"><span class="led on" id="led"></span><span>COOLAIR</span></div>
      <div class="model">KFR-35GW</div>
    </div>

    <div class="screen">
      <div class="lcd">
        <div class="lcd-body" id="lcdBody">
          <div class="lcd-row">
            <span class="chip" id="modeChip">制冷</span>
            <span class="chip">风速<span class="fanbars" id="fanBars"><i></i><i></i><i></i></span></span>
          </div>

          <div class="temp-row">
            <span class="temp-val" id="tempVal">26</span>
            <span class="unit">°C</span>
          </div>

          <div class="lcd-row">
            <span class="chip" id="roomChip">室温 28°C</span>
            <span class="chip" id="timerChip">定时 关</span>
            <span class="flags">
              <i id="swingFlag">扫</i>
              <i id="sleepFlag">睡</i>
              <i id="ecoFlag">节</i>
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="keys" id="keys">
      <button class="key power on" data-act="power" aria-label="电源">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v8"/><path d="M7.2 6.4a7.2 7.2 0 1 0 9.6 0"/></svg>
        <span class="lbl">电源</span>
      </button>

      <button class="key" data-act="mode" aria-label="模式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>
        <span class="lbl">模式</span>
      </button>

      <button class="key" data-act="fan" aria-label="风速">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5h9.5a3 3 0 1 0-3-3"/><path d="M3 15.5h13a3 3 0 1 1-3 3"/><path d="M3 12h6"/></svg>
        <span class="lbl">风速</span>
      </button>

      <button class="key" data-act="tempUp" aria-label="升温">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5"/><path d="M5.5 11.5 12 5l6.5 6.5"/></svg>
        <span class="lbl">升温</span>
      </button>

      <button class="key" data-act="swing" aria-label="扫风">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v5M9.2 6 12 3.3 14.8 6"/><path d="M12 20.5v-5M9.2 18l2.8 2.7 2.8-2.7"/><path d="M6.5 12h11" opacity=".45"/></svg>
        <span class="lbl">扫风</span>
      </button>

      <button class="key" data-act="timer" aria-label="定时">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12l3.4 2.1"/></svg>
        <span class="lbl">定时</span>
      </button>

      <button class="key" data-act="tempDown" aria-label="降温">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15"/><path d="M5.5 12.5 12 19l6.5-6.5"/></svg>
        <span class="lbl">降温</span>
      </button>

      <button class="key" data-act="sleep" aria-label="睡眠">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>
        <span class="lbl">睡眠</span>
      </button>

      <button class="key" data-act="eco" aria-label="节能">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C10.6 4.6 5 9.2 4.6 19.8c10.9.2 15-5.8 15.4-15.8z"/><path d="M4.8 19.6C8 14 11.5 10.5 16 8.5"/></svg>
        <span class="lbl">节能</span>
      </button>
    </div>
  </div>

  <div class="hint">
    <span><kbd>↑</kbd><kbd>↓</kbd> 调温</span>
    <span><kbd>Space</kbd> 电源</span>
    <span><kbd>M</kbd> 模式</span>
    <span><kbd>F</kbd> 风速</span>
    <button class="sound-btn" id="soundBtn" type="button">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" id="wave1"/><path d="M18.6 5.8a9 9 0 0 1 0 12.4" id="wave2"/></svg>
      <span id="soundTxt">声音 开</span>
    </button>
  </div>
</main>

<script>
(function () {
  'use strict';

  var MODES = [
    { name: '制冷', color: '#38bdf8' },
    { name: '除湿', color: '#2dd4bf' },
    { name: '送风', color: '#94a3b8' },
    { name: '制热', color: '#fb923c' },
    { name: '自动', color: '#4ade80' }
  ];
  var FANS = ['自动', '低风', '中风', '高风'];
  var TIMERS = [0, 0.5, 1, 2, 3, 4, 5, 6, 8, 10, 12];
  var TEMP_MIN = 16, TEMP_MAX = 30;

  var state = {
    power: true,
    mode: 0,
    temp: 26,
    fan: 0,
    swing: false,
    timer: 0,
    sleep: false,
    eco: false,
    muted: false
  };

  var el = {
    remote: document.getElementById('remote'),
    led: document.getElementById('led'),
    modeChip: document.getElementById('modeChip'),
    fanBars: document.getElementById('fanBars'),
    tempVal: document.getElementById('tempVal'),
    roomChip: document.getElementById('roomChip'),
    timerChip: document.getElementById('timerChip'),
    swingFlag: document.getElementById('swingFlag'),
    sleepFlag: document.getElementById('sleepFlag'),
    ecoFlag: document.getElementById('ecoFlag'),
    powerKey: document.querySelector('[data-act="power"]'),
    soundTxt: document.getElementById('soundTxt'),
    wave1: document.getElementById('wave1'),
    wave2: document.getElementById('wave2')
  };

  /* ---------------- 音效 ---------------- */
  var actx = null;
  function tone(freq, dur, vol, type) {
    if (state.muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var t0 = actx.currentTime;
      var osc = actx.createOscillator();
      var g = actx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.03, t0 + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(actx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) { /* 静默失败 */ }
  }
  function click() { tone(1180, 0.05, 0.028); }
  function chime(up) {
    tone(up ? 900 : 1300, 0.09, 0.03, 'triangle');
    setTimeout(function () { tone(up ? 1350 : 880, 0.12, 0.028, 'triangle'); }, 105);
  }

  /* ---------------- 渲染 ---------------- */
  function setAccent(color) {
    document.documentElement.style.setProperty('--accent', color);
  }

  function render(opt) {
    opt = opt || {};
    var m = MODES[state.mode];
    setAccent(m.color);

    el.remote.classList.toggle('off', !state.power);
    el.led.classList.toggle('on', state.power);
    el.powerKey.classList.toggle('on', state.power);
    document.body.classList.toggle('power-off', !state.power);

    el.modeChip.textContent = m.name;
    el.tempVal.textContent = state.temp;

    // 风速柱
    var bars = el.fanBars.children;
    var level = state.fan; // 0 自动
    el.fanBars.classList.toggle('auto', level === 0);
    for (var i = 0; i < bars.length; i++) {
      bars[i].classList.toggle('on', level === 0 ? true : i < level);
    }

    // 定时
    el.timerChip.textContent = state.timer === 0
      ? '定时 关'
      : '定时 ' + (state.timer < 1 ? state.timer + 'h' : state.timer + 'h');

    // 功能旗标
    el.swingFlag.classList.toggle('on', state.swing);
    el.sleepFlag.classList.toggle('on', state.sleep);
    el.ecoFlag.classList.toggle('on', state.eco);

    // 按键激活态
    document.querySelector('[data-act="swing"]').classList.toggle('active', state.swing);
    document.querySelector('[data-act="sleep"]').classList.toggle('active', state.sleep);
    document.querySelector('[data-act="eco"]').classList.toggle('active', state.eco);
    document.querySelector('[data-act="timer"]').classList.toggle('active', state.timer > 0);

    if (opt.pop) {
      el.tempVal.classList.remove('pop');
      void el.tempVal.offsetWidth;
      el.tempVal.classList.add('pop');
    }
  }

  /* ---------------- 动作 ---------------- */
  var actions = {
    power: function () {
      state.power = !state.power;
      chime(state.power);
      if (state.power) state.temp = Math.max(TEMP_MIN, Math.min(TEMP_MAX, state.temp));
    },
    mode: function () {
      wake();
      state.mode = (state.mode + 1) % MODES.length;
    },
    fan: function () {
      wake();
      state.fan = (state.fan + 1) % FANS.length;
    },
    tempUp: function () {
      wake();
      if (state.temp >= TEMP_MAX) { tone(620, 0.07, 0.025); return false; }
      state.temp++;
      return 'pop';
    },
    tempDown: function () {
      wake();
      if (state.temp <= TEMP_MIN) { tone(620, 0.07, 0.025); return false; }
      state.temp--;
      return 'pop';
    },
    swing: function () { wake(); state.swing = !state.swing; },
    timer: function () {
      wake();
      var idx = TIMERS.indexOf(state.timer);
      state.timer = TIMERS[(idx + 1) % TIMERS.length];
    },
    sleep: function () { wake(); state.sleep = !state.sleep; },
    eco: function () { wake(); state.eco = !state.eco; }
  };

  // 关机状态下按任意功能键自动开机
  function wake() {
    if (!state.power) {
      state.power = true;
      chime(true);
    }
  }

  /* ---------------- 事件绑定 ---------------- */
  document.querySelectorAll('.key').forEach(function (btn) {
    var act = btn.dataset.act;
    var holdTimer = null, holdInterval = null;

    function fire() {
      var res = actions[act]();
      if (res !== false) click();
      render({ pop: res === 'pop' });
    }

    btn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      fire();
      if (act === 'tempUp' || act === 'tempDown') {
        holdTimer = setTimeout(function () {
          holdInterval = setInterval(fire, 110);
        }, 460);
      }
    });

    function stop() {
      clearTimeout(holdTimer);
      clearInterval(holdInterval);
      holdTimer = holdInterval = null;
    }
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointerleave', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // 键盘触发时的高亮
    btn._press = function () {
      btn.classList.add('pressed');
      setTimeout(function () { btn.classList.remove('pressed'); }, 120);
    };
  });

  /* ---------------- 键盘 ---------------- */
  var keyMap = {
    ' ': 'power',
    'Enter': 'power',
    'ArrowUp': 'tempUp',
    'ArrowDown': 'tempDown',
    'm': 'mode', 'M': 'mode',
    'f': 'fan', 'F': 'fan',
    's': 'swing', 'S': 'swing',
    't': 'timer', 'T': 'timer',
    'n': 'sleep', 'N': 'sleep',
    'e': 'eco', 'E': 'eco'
  };

  window.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var act = keyMap[e.key];
    if (!act) return;
    var btn = document.querySelector('[data-act="' + act + '"]');
    if (!btn) return;
    e.preventDefault();
    if (e.repeat) return;
    btn._press();
    var res = actions[act]();
    if (res !== false) click();
    render({ pop: res === 'pop' });
  });

  /* ---------------- 声音开关 ---------------- */
  document.getElementById('soundBtn').addEventListener('click', function () {
    state.muted = !state.muted;
    el.soundTxt.textContent = state.muted ? '声音 关' : '声音 开';
    el.wave1.style.display = state.muted ? 'none' : '';
    el.wave2.style.display = state.muted ? 'none' : '';
    if (!state.muted) click();
  });

  /* ---------------- 初始化 ---------------- */
  render();
})();
